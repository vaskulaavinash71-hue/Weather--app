<!doctype html>
<html>
  <head>
    <title>Weather App - Avinash</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h2>🌤️ Weather App</h2>
      <div class="search">
        <input type="text" id="city" placeholder="Enter city - e.g Hyderabad" />
        <button onclick="getWeather()">Search</button>
      </div>
      <div id="result">
        <h3 id="cityName"></h3>
        <h1 id="temp"></h1>
        <p id="desc"></p>
        <p id="humidity"></p>
      </div>
      <p style="font-size: 12px; margin-top: 15px">
        Built by Avinash | HTML CSS JS + API
      </p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
